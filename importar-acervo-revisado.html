<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar acervo revisado — AMARAL RAD</title><style>body{font:17px system-ui;background:#f4f7fb;color:#16233b;margin:0}main{max-width:900px;margin:40px auto;padding:28px;background:white;border-radius:18px}button,input{font:inherit;padding:12px}button{background:#194e88;color:white;border:0;border-radius:9px;cursor:pointer}button:disabled{opacity:.5}li{padding:9px;border-bottom:1px solid #ddd}a{color:#194e88}#status{white-space:pre-wrap}</style><main><h1>Importar acervo revisado</h1><p>Os conjuntos são guardados como rascunhos na biblioteca da turma. Nenhum material é liberado automaticamente aos alunos.</p><p><a href="biblioteca-arquivos.html">Abrir biblioteca da turma</a></p><p id="access">Conferindo acesso da professora…</p><section id="controls" hidden><p><label>Pacote de conjuntos revisados <input type="file" id="package" accept=".arlib"></label></p><p><label><input type="checkbox" id="reviewed"> Revisei os metadados, os pixels e a permissão de uso dos materiais.</label></p><button id="prepare">Conferir pacote</button> <button id="send" disabled>Enviar conjuntos como rascunhos</button></section><p id="status" role="status"></p><ol id="sets"></ol></main><script src="_workstation-integration/file-library-store.js"></script><script src="_workstation-integration/file-library-cloud.js"></script><script>
'use strict';
const el=id=>document.getElementById(id);let pending=[],busy=false;
const status=t=>{el('status').textContent=t};
function busyState(b){busy=b;el('prepare').disabled=b;el('package').disabled=b;el('reviewed').disabled=b;el('send').disabled=b||!pending.length;}
(async()=>{try{const c=await AmaralCloudLibrary.context();if(!c?.teacher)throw Error('Entre na biblioteca da turma com a conta da professora nesta mesma aba e volte para esta página.');el('access').textContent='Acesso da professora confirmado.';el('controls').hidden=false;}catch(e){el('access').textContent=e.message;}})();
el('prepare').onclick=async()=>{if(busy)return;try{if(!el('reviewed').checked)throw Error('Confirme a revisão de privacidade e a permissão de uso.');const file=el('package').files[0];if(!file)throw Error('Escolha o pacote revisado.');busyState(true);status('Conferindo pacote…');const before=new Set((await AmaralFileLibrary.list()).map(x=>x.id));await AmaralFileLibrary.importPackage(file,true);pending=(await AmaralFileLibrary.list()).filter(x=>!before.has(x.id));el('sets').replaceChildren();for(const x of pending){const li=document.createElement('li');li.textContent=x.title+' — '+x.files.length+' arquivo(s)';li.dataset.localId=x.id;el('sets').append(li);}status(pending.length+' conjuntos conferidos. Nenhum envio realizado ainda.');}catch(e){status('Não foi possível preparar: '+e.message);}finally{busyState(false);}};
el('send').onclick=async()=>{if(busy)return;busyState(true);let done=0;try{if(!el('reviewed').checked)throw Error('Confirme a revisão.');const existing=await AmaralCloudLibrary.list();for(const x of pending){if(existing.some(b=>b.titulo===x.title))throw Error('Já existe um conjunto com este título. Confira o rascunho existente antes de repetir: '+x.title);}for(const x of pending){const li=Array.from(el('sets').children).find(n=>n.dataset.localId===x.id);status('Enviando '+(done+1)+' de '+pending.length+': '+x.title);const b=await AmaralCloudLibrary.upload(x,AmaralFileLibrary.asFiles(x),(n,t)=>status('Enviando '+(done+1)+' de '+pending.length+': '+x.title+' — '+Math.floor(100*n/t)+'%'));const check=await AmaralCloudLibrary.details(b.id);if(check.publicado||check.files.length!==x.files.length||check.tamanho!==AmaralFileLibrary.size(x))throw Error('A conferência do rascunho não corresponde ao pacote.');li.textContent=x.title+' — '+x.files.length+' arquivo(s) — RASCUNHO ENVIADO';done++;}status('ENVIO CONCLUÍDO: '+done+' conjuntos em rascunho. Nenhum material foi liberado aos alunos.');pending=[];}catch(e){status('Envio interrompido após '+done+' conjunto(s). Não repita o lote sem conferir os rascunhos. '+e.message);}finally{busyState(false);}};
</script></html>
