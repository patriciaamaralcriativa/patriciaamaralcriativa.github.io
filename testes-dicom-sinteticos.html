<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>AMARAL RAD — testes sintéticos DICOM</title><style>body{font:16px system-ui;background:#101c29;color:#e7f5ff;max-width:850px;margin:40px auto;padding:16px}li{margin:8px 0}.ok{color:#85e7a3}.fail{color:#ff9c9c}</style><h1>Testes sintéticos DICOM — sem dados de pacientes</h1><p>Execute esta página em navegador com o leitor DICOM da mesma ramificação. Nenhum arquivo é enviado a servidores.</p><ol id="results"></ol><p id="summary" role="status"></p><script src="_workstation-integration/mamografia-dicom-inspector.js"></script><script>
(()=>{'use strict';const result=document.getElementById('results');let passed=0,failed=0;
function check(name,fn){const li=document.createElement('li');try{fn();li.textContent='PASSOU — '+name;li.className='ok';passed++}catch(e){li.textContent='FALHOU — '+name+': '+e.message;li.className='fail';failed++}result.append(li)}
function assert(cond,message){if(!cond)throw Error(message)}
const enc=new TextEncoder(),concat=parts=>{let n=parts.reduce((s,p)=>s+p.length,0),out=new Uint8Array(n),o=0;for(const p of parts){out.set(p,o);o+=p.length}return out};
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function element(g,e,vr,value){let v=typeof value==='string'?enc.encode(value):value;if(v.length%2)v=concat([v,new Uint8Array([vr==='UI'?0:32])]);const long=['OB','OW','SQ','UN','UT'].includes(vr);return concat([u16(g),u16(e),enc.encode(vr),long?new Uint8Array(2):new Uint8Array(0),long?u32(v.length):u16(v.length),v])}
function file({syntax='1.2.840.10008.1.2.1',frames=2,highBit=7,samples=1,includeSyntax=true,pixels=new Uint8Array([0,255,100,200])}={}){const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const parts=[pre];if(includeSyntax)parts.push(element(2,0x10,'UI',syntax));parts.push(element(8,0x60,'CS','MG'),element(0x28,0x10,'US',u16(1)),element(0x28,0x11,'US',u16(2)),element(0x28,0x08,'IS',String(frames)),element(0x28,0x02,'US',u16(samples)),element(0x28,0x04,'CS','MONOCHROME2'),element(0x28,0x100,'US',u16(8)),element(0x28,0x101,'US',u16(8)),element(0x28,0x102,'US',u16(highBit)),element(0x28,0x103,'US',u16(0)),element(0x7fe0,0x10,'OB',pixels));return concat(parts).buffer}
function fakeCanvas(){let last=null;const ctx={createImageData(w,h){return {data:new Uint8ClampedArray(w*h*4)}},putImageData(img){last=img}};return {getContext(){return ctx},get pixels(){return last?.data}}}
const api=window.AmaralMamografiaDicom;
check('API disponível',()=>assert(!!api,'API não carregada'));
if(api){check('Identifica dois frames e modalidade MG',()=>{const b=file(),i=api.inspect(b);assert(i.metadata.modality==='MG'&&i.metadata.numberOfFrames==='2'&&i.pixelDataPresent,'metadados incorretos')});
check('Frames distintos preservam ordem de pixels',()=>{const b=file(),i=api.inspect(b),c=fakeCanvas();api.renderGrayscale(b,i,c,{frameIndex:0,center:127.5,width:255});const a=[c.pixels[0],c.pixels[4]];api.renderGrayscale(b,i,c,{frameIndex:1,center:127.5,width:255});const d=[c.pixels[0],c.pixels[4]];assert(a[0]===0&&a[1]===255&&d[0]===100&&d[1]===201,'valores inesperados: '+a+'/'+d)});
check('Rejeita frame fora do intervalo',()=>{const b=file(),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas(),{frameIndex:2})}catch(e){rejected=true}assert(rejected,'frame inválido aceito')});
check('Rejeita Pixel Data incompleto',()=>{const b=file({pixels:new Uint8Array([1,2])}),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas(),{frameIndex:1})}catch(e){rejected=true}assert(rejected,'pixels incompletos aceitos')});
check('Rejeita High Bit incompatível',()=>{const b=file({highBit:6}),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas())}catch(e){rejected=true}assert(rejected,'High Bit incompatível aceito')});
check('Rejeita Samples per Pixel diferente de 1',()=>{const b=file({samples:3}),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas())}catch(e){rejected=true}assert(rejected,'amostras inválidas aceitas')});
check('Rejeita Transfer Syntax ausente',()=>{const b=file({includeSyntax:false}),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas())}catch(e){rejected=true}assert(rejected,'Transfer Syntax ausente aceita')});
check('Rejeita sintaxe comprimida não suportada',()=>{const b=file({syntax:'1.2.840.10008.1.2.4.50'}),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas())}catch(e){rejected=true}assert(rejected,'sintaxe comprimida aceita')});
check('Rejeita arquivo sem preâmbulo Part 10',()=>{let rejected=false;try{api.inspect(new Uint8Array(200).buffer)}catch(e){rejected=true}assert(rejected,'arquivo inválido aceito')})}

// Casos adicionais: valores de pixels conhecidos, sem dados de pacientes.
function extendedFile({photo='MONOCHROME2',bits=8,stored=8,rep=0,values=[0,255],center=null,width=null}={}){
const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);
const pix=concat(values.map(v=>bits===16?u16(v&65535):new Uint8Array([v&255])));
const parts=[pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(8,0x60,'CS','MG'),
element(0x28,0x10,'US',u16(1)),element(0x28,0x11,'US',u16(values.length)),element(0x28,0x02,'US',u16(1)),
element(0x28,0x04,'CS',photo),element(0x28,0x100,'US',u16(bits)),element(0x28,0x101,'US',u16(stored)),
element(0x28,0x102,'US',u16(stored-1)),element(0x28,0x103,'US',u16(rep))];
if(center!==null)parts.push(element(0x28,0x1050,'DS',String(center)));
if(width!==null)parts.push(element(0x28,0x1051,'DS',String(width)));
parts.push(element(0x7fe0,0x10,bits===16?'OW':'OB',pix));
return concat(parts).buffer;
}
if(api){
check('MONOCHROME1 inverte a escala exibida',()=>{const b=extendedFile({photo:'MONOCHROME1'}),c=fakeCanvas();api.renderGrayscale(b,api.inspect(b),c,{center:127.5,width:255});assert(c.pixels[0]===255&&c.pixels[4]===0,'inversão incorreta')});
check('16 bits assinados preservam sinal',()=>{const b=extendedFile({bits:16,stored:16,rep:1,values:[-100,100]}),c=fakeCanvas();const v=api.renderGrayscale(b,api.inspect(b),c,{center:0,width:200});assert(v.min===-100&&v.max===100&&c.pixels[0]===0&&c.pixels[4]===255,'sinal incorreto')});
check('Janela DICOM numérica é reconhecida',()=>{const b=extendedFile({center:100,width:200,values:[0,200]}),c=fakeCanvas();const v=api.renderGrayscale(b,api.inspect(b),c);assert(v.center===100&&v.width===200&&c.pixels[0]===0&&c.pixels[4]===255,'janela não aplicada')});
check('Rejeita índice de frame negativo',()=>{const b=file(),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas(),{frameIndex:-1})}catch(e){rejected=true}assert(rejected,'índice negativo aceito')});
check('Rejeita quantidade de frames acima do limite',()=>{const b=file({frames:501}),i=api.inspect(b);let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas())}catch(e){rejected=true}assert(rejected,'501 frames aceitos')});
}


if(api){
check('Janela linear com largura 1 aplica limiar binário',()=>{const b=extendedFile({center:100,width:1,values:[99,100,101]}),c=fakeCanvas();const v=api.renderGrayscale(b,api.inspect(b),c);assert(v.width===1&&c.pixels[0]===0&&c.pixels[4]===255&&c.pixels[8]===255,'limiar de largura 1 incorreto')});
check('Janela linear com largura 2 preserva extremos',()=>{const b=extendedFile({center:100,width:2,values:[99,100]}),c=fakeCanvas();api.renderGrayscale(b,api.inspect(b),c);assert(c.pixels[0]===0&&c.pixels[4]===255,'extremos da janela incorretos')});
check('MONOCHROME1 com largura 1 inverte limiar',()=>{const b=extendedFile({photo:'MONOCHROME1',center:100,width:1,values:[99,100]}),c=fakeCanvas();api.renderGrayscale(b,api.inspect(b),c);assert(c.pixels[0]===255&&c.pixels[4]===0,'limiar invertido incorreto')});
}


if(api){
check('Detecta sequências funcionais multiframe e bloqueia renderização',()=>{
const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);
const parts=[pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(8,0x60,'CS','MG'),
element(0x28,0x10,'US',u16(1)),element(0x28,0x11,'US',u16(2)),element(0x28,0x02,'US',u16(1)),
element(0x28,0x04,'CS','MONOCHROME2'),element(0x28,0x100,'US',u16(8)),element(0x28,0x101,'US',u16(8)),
element(0x28,0x102,'US',u16(7)),element(0x28,0x103,'US',u16(0)),
element(0x5200,0x9230,'SQ',new Uint8Array(0)),element(0x7fe0,0x10,'OB',new Uint8Array([0,255]))];
const b=concat(parts).buffer,i=api.inspect(b);
assert(i.functionalGroupsPresent===true,'sequência funcional não detectada');
let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas())}catch(e){rejected=true}
assert(rejected,'renderização com functional groups aceita');
});
}


if(api){
check('12 bits armazenados em 16 bits sem sinal',()=>{const b=extendedFile({bits:16,stored:12,rep:0,values:[0,4095]}),c=fakeCanvas();const v=api.renderGrayscale(b,api.inspect(b),c,{center:2047.5,width:4095});assert(v.min===0&&v.max===4095&&c.pixels[0]===0&&c.pixels[4]===255,'pixels de 12 bits incorretos')});
check('12 bits assinados com extensão de sinal',()=>{const b=extendedFile({bits:16,stored:12,rep:1,values:[-2048,2047]}),c=fakeCanvas();const v=api.renderGrayscale(b,api.inspect(b),c,{center:-0.5,width:4095});assert(v.min===-2048&&v.max===2047&&c.pixels[0]===0&&c.pixels[4]===255,'sinal de 12 bits incorreto')});
check('Sequência indefinida não é interpretada como pixels',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const sq=concat([u16(0x5200),u16(0x9230),enc.encode('SQ'),new Uint8Array(2),u32(0xffffffff)]);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),sq]).buffer;let rejected=false;try{api.inspect(b)}catch(e){rejected=/indefinido/.test(e.message)}assert(rejected,'sequência indefinida não foi rejeitada')});
}


if(api){
check('Identifica SOP Class de tomossíntese e bloqueia pixels',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(8,0x16,'UI','1.2.840.10008.5.1.4.1.1.13.1.3'),element(8,0x60,'CS','MG'),element(0x28,0x10,'US',u16(1)),element(0x28,0x11,'US',u16(2)),element(0x28,0x02,'US',u16(1)),element(0x28,0x04,'CS','MONOCHROME2'),element(0x28,0x100,'US',u16(8)),element(0x28,0x101,'US',u16(8)),element(0x28,0x102,'US',u16(7)),element(0x28,0x103,'US',u16(0)),element(0x7fe0,0x10,'OB',new Uint8Array([0,255]))]).buffer;const i=api.inspect(b);assert(i.imageType==='breast-tomosynthesis','SOP Class DBT não reconhecida');let rejected=false;try{api.renderGrayscale(b,i,fakeCanvas())}catch(e){rejected=true}assert(rejected,'DBT não validada foi renderizada')});
}


if(api){
check('DBT sem Number of Frames não inventa quantidade de cortes',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(8,0x16,'UI','1.2.840.10008.5.1.4.1.1.13.1.3'),element(8,0x60,'CS','MG')]).buffer;const i=api.inspect(b);assert(i.imageType==='breast-tomosynthesis'&&i.frameSummary.declaredFrames===null&&!i.frameSummary.frameCountValidated&&!i.frameSummary.geometryValidated,'quantidade ou geometria inferida indevidamente')});
check('DBT declara frames mas não presume ordem ou geometria',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(8,0x16,'UI','1.2.840.10008.5.1.4.1.1.13.1.3'),element(8,0x60,'CS','MG'),element(0x28,0x08,'IS','12')]).buffer;const i=api.inspect(b);assert(i.frameSummary.declaredFrames===12&&i.frameSummary.frameCountValidated&&!i.frameSummary.geometryValidated&&!i.frameSummary.frameOrderValidated,'resumo incorreto')});
}


if(api){
check('Lê atributos geométricos top-level sem inferir geometria DBT',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(8,0x16,'UI','1.2.840.10008.5.1.4.1.1.13.1.3'),element(8,0x60,'CS','MG'),element(0x18,0x50,'DS','1.5'),element(0x20,0x32,'DS','1\\2\\3'),element(0x20,0x37,'DS','1\\0\\0\\0\\1\\0')]).buffer;const i=api.inspect(b);assert(i.geometryAttributes.sliceThickness[0]===1.5&&i.geometryAttributes.imagePositionPatient.length===3&&i.geometryAttributes.imageOrientationPatient.length===6&&!i.frameSummary.geometryValidated,'geometria indevidamente inferida')});
check('Rejeita geometria top-level com valor inválido',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(0x20,0x32,'DS','1\\ABC\\3')]).buffer;const i=api.inspect(b);assert(i.geometryAttributes.imagePositionPatient===null&&i.warnings.some(w=>w.includes('imagePositionPatient')),'geometria inválida aceita')});
}


if(api){
check('Registra grupos compartilhados e por frame sem interpretar geometria',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(0x5200,0x9229,'SQ',new Uint8Array(0)),element(0x5200,0x9230,'SQ',new Uint8Array(0))]).buffer;const i=api.inspect(b);assert(i.functionalGroupSummary.sharedPresent&&i.functionalGroupSummary.perFramePresent&&i.functionalGroupSummary.sharedLength===0&&i.functionalGroupSummary.perFrameLength===0&&!i.functionalGroupSummary.parsed,'resumo de sequências incorreto')});
}


if(api){
check('Sequência funcional com um item definido é contada sem ler geometria',()=>{const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);const item=concat([u16(0xfffe),u16(0xe000),u32(0)]);const b=concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),element(0x5200,0x9230,'SQ',item)]).buffer;const i=api.inspect(b);assert(i.functionalGroupSummary.perFrameItems===1&&i.functionalGroupSummary.perFrameStructureValidated&&!i.functionalGroupSummary.parsed,'item não contado corretamente')});

}


if(api){
function dbtFunctionalFixture(declared,perItems,sharedItems=1){
const pre=new Uint8Array(132);pre.set(enc.encode('DICM'),128);
const item=()=>concat([u16(0xfffe),u16(0xe000),u32(0)]);
const many=n=>concat(Array.from({length:n},item));
return concat([pre,element(2,0x10,'UI','1.2.840.10008.1.2.1'),
element(8,0x16,'UI','1.2.840.10008.5.1.4.1.1.13.1.3'),
element(8,0x60,'CS','MG'),element(0x28,0x08,'IS',String(declared)),
element(0x5200,0x9229,'SQ',many(sharedItems)),
element(0x5200,0x9230,'SQ',many(perItems))]).buffer;
}
check('DBT compara itens Per-frame com Number of Frames',()=>{const i=api.inspect(dbtFunctionalFixture(3,3));assert(i.frameSummary.perFrameCountMatchesDeclared===true&&i.frameSummary.sharedItemCountValid===true&&!i.frameSummary.geometryValidated,'comparação incorreta')});
check('DBT alerta quando faltam itens por frame',()=>{const i=api.inspect(dbtFunctionalFixture(3,2));assert(i.frameSummary.perFrameCountMatchesDeclared===false&&i.warnings.some(w=>w.includes('difere')),'divergência não detectada')});
check('DBT alerta quando Shared Functional Groups possui dois itens',()=>{const i=api.inspect(dbtFunctionalFixture(2,2,2));assert(i.frameSummary.sharedItemCountValid===false&&i.warnings.some(w=>w.includes('exatamente um item')),'quantidade compartilhada incorreta')});
}

}

if(api){

if(api){
