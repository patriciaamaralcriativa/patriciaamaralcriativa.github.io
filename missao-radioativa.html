<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missão Radioativa • Patrícia Amaral</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#224d8b,#080c25 72%);color:white;font-family:system-ui,Arial}header{text-align:center;padding:12px}h1{margin:0;color:#ffdc4e;font-size:clamp(26px,3vw,48px)}header p{margin:4px}main{display:grid;grid-template-columns:185px minmax(0,1fr) 205px;gap:10px;padding:10px;min-height:calc(100vh - 96px)}aside,.board{background:#10183f;border:2px solid #487cfb;border-radius:18px;padding:10px;box-shadow:0 0 18px #275bfa55}aside{display:flex;flex-direction:column;gap:10px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(100px,1fr));gap:8px}.tile{border:2px solid #b25aff;border-radius:12px;background:linear-gradient(130deg,#26247b,#5d28b1);color:white;font:700 clamp(11px,1.05vw,17px) system-ui;padding:6px;cursor:pointer;overflow-wrap:anywhere}.tile.back{font-size:clamp(12px,1.3vw,19px);letter-spacing:.04em}.tile.back.question{background:linear-gradient(135deg,#2249b9,#246bd0);border-color:#73c4ff}.tile.back.answer{background:linear-gradient(135deg,#7a278f,#ac389e);border-color:#ffa5ef}.tile.back:has(+.tile){text-shadow:0 1px 2px #0005}.tile.open{background:#d9efff;color:#102453;border-color:#70dfff}.tile.done{background:#c3ffd5;color:#11502a;border-color:#31e87b}button.action,.level{border:1px solid #aac6ff;border-radius:10px;padding:10px 6px;background:linear-gradient(#3776ef,#233e9c);color:white;font-weight:800;cursor:pointer}.level.active{background:#087d58}.action.good{background:#198548}.action.gold{background:#bd7a11}.bubble{background:#173965;border:2px solid #69d9ff;border-radius:15px;padding:12px;min-height:115px;line-height:1.4;font-weight:700}.bubble.win{background:#14623b}.bubble.fail{background:#822842}.count{text-align:center;color:#ffda4c;font-size:44px}.small{font-size:12px;color:#c4d4f7}button:focus-visible{outline:3px solid yellow}@media(max-width:900px){main{display:flex;flex-direction:column}.board{min-height:680px}.tile{font-size:11px}aside{flex-direction:row;flex-wrap:wrap}aside>*{flex:1 1 120px}}@media(min-width:901px){body{overflow:hidden}}header{position:relative;overflow:hidden;border-bottom:2px solid #8c4aff;background:linear-gradient(100deg,#090b2e,#35106a 55%,#0b3b71);box-shadow:0 5px 24px #b11cff66}header:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 65px,#a7e7ff09 67px 69px);pointer-events:none}header h1{position:relative;text-shadow:0 2px 0 #7220b0,0 0 18px #c229ff}header p{position:relative}.hero{display:none;position:relative;max-width:1120px;margin:10px auto 4px;overflow:hidden;border-radius:18px;border:2px solid #b75bff;box-shadow:0 0 24px #9e2aff66}.hero img{width:100%;display:block}.hero a{position:absolute;inset:0;display:block}.hero.visible{display:block}.tile{transition:transform .18s,box-shadow .18s,background .18s}.tile:hover{transform:translateY(-2px);box-shadow:0 0 13px #76e4ff88}.tile.open{animation:reveal .22s ease-out}.tile.done{box-shadow:0 0 14px #1bff8970}@keyframes reveal{from{transform:rotateY(65deg) scale(.96)}to{transform:rotateY(0) scale(1)}}.bubble.win{animation:pop .35s ease-out}.bubble.fail{animation:shake .32s ease-out}@keyframes pop{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:900px){.hero{margin:8px 10px}} </style>
<header><h1>☢ MISSÃO RADIOATIVA ☢</h1><p>GERENCIAMENTO DE REJEITOS RADIOATIVOS • JOGO DA MEMÓRIA • PROFESSORA PATRÍCIA AMARAL</p></header>
<div class="hero" id="hero"><img src="missao-radioativa-banner.png" alt="Convite da professora Patrícia para o jogo Missão Radioativa" onload="this.parentElement.classList.add('visible')" onerror="this.parentElement.remove()"><a href="#board" aria-label="Ir para o jogo"></a></div><main><aside><b>🎮 NÍVEIS</b><button class="level active" onclick="choose(0)">⭐ FÁCIL</button><button class="level" onclick="choose(1)">⭐⭐ INTERMEDIÁRIO</button><button class="level" onclick="choose(2)">👑 DIFÍCIL</button><strong id="stats"></strong><strong id="errors"></strong><button class="action good" onclick="check()">✔ CONFERIR RESPOSTA</button><button class="action" onclick="turnBack()">↶ VIRAR CARTAS</button><button class="action" onclick="start()">▶ COMEÇAR</button><button class="action" onclick="document.documentElement.requestFullscreen?.()">⛶ TELA CHEIA</button><span class="small">Enter: conferir • Espaço: virar de volta</span></aside><section class="board" id="board"></section><aside><b>👩‍🏫 PROFESSORA PATRÍCIA</b><div class="bubble" id="bubble">Preparados? Vamos aprender brincando!</div><div class="count" id="count"></div><button class="action gold" onclick="next()">⏭ PRÓXIMO NÍVEL</button><button class="action" onclick="build()">↻ REINICIAR</button><span class="small">Os cartões ficam abertos até você decidir virá-los.</span></aside></main><script>
const sets=[[["Qual nome recebe o material radioativo sem uso previsto?","Rejeito radioativo"],["Qual tipo de rejeito é gerado em hospitais?","Institucional"],["Qual tipo está ligado à produção do combustível nuclear?","Ciclo do combustível"],["Qual é a primeira etapa?","Coleta"],["Qual é a segunda etapa?","Segregação"],["Qual é a terceira etapa?","Tratamento"],["Qual é a quarta etapa?","Armazenamento temporário"],["Qual é a quinta etapa?","Disposição final"],["Qual critério separa sólidos, líquidos e gases?","Natureza física"],["Qual critério considera meia-vida, atividade e radiação?","Natureza radiológica"]],[["Qual característica indica o tempo para a atividade cair à metade?","Meia-vida"],["Qual característica mede transformações nucleares por segundo?","Atividade radioativa"],["O que diferencia emissões alfa, beta e gama?","Tipo de radiação"],["Qual tratamento de sólidos comprime o material?","Prensagem"],["Qual tratamento térmico de sólidos reduz o volume?","Incineração"],["Qual tratamento de líquidos ajusta a acidez?","Neutralização"],["Qual tratamento de líquidos forma um sólido separável?","Precipitação"],["Qual tratamento remove líquido por vaporização?","Evaporação"],["Qual tratamento imobiliza líquidos em matriz sólida?","Solidificação"],["Qual tratamento de gases utiliza filtros?","Filtração"]],[["Qual tratamento de gases utiliza contato com líquido?","Lavagem de gases"],["Qual forma de disposição utiliza barreiras de isolamento?","Confinamento"],["Qual forma envolve liberação controlada, quando autorizada?","Dispersão"],["Como se chamam instalações de disposição de rejeitos?","Repositórios"],["Qual etapa vem logo depois da coleta?","Segregação"],["Qual etapa vem antes do armazenamento temporário?","Tratamento"],["Qual etapa vem depois do armazenamento temporário?","Disposição final"],["Qual objetivo principal do gerenciamento?","Proteção radiológica"],["Qual forma de disposição pode utilizar repositórios?","Confinamento"],["Qual etapa vem antes da segregação?","Coleta"]]];let level=0,deck=[],opened=[],matched=new Set(),errors=0,sound=true,voice=true,ctx;const $=id=>document.getElementById(id);
function tone(f=500,d=.14){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function say(s){if(!voice||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';u.rate=1.12;u.pitch=1.18;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().startsWith('pt-br')&&/natural|neural|google|microsoft/i.test(v.name))||vs.find(v=>v.lang.toLowerCase().startsWith('pt-br'))||null;speechSynthesis.speak(u)}
function feedback(s,k=''){let b=$('bubble');b.textContent=s;b.className='bubble '+k}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){deck=shuffle(sets[level].flatMap(([q,a],id)=>[{id,kind:'q',text:q},{id,kind:'a',text:a}]));opened=[];matched.clear();errors=0;document.querySelectorAll('.level').forEach((b,i)=>b.classList.toggle('active',i===level));$('count').textContent='';feedback('Escolham duas cartas e confiram o par!');render()}
function render(){$('stats').textContent='Pares: '+matched.size/2+'/10';$('errors').textContent='Erros: '+errors;$('board').replaceChildren();deck.forEach((c,i)=>{let b=document.createElement('button');b.className='tile '+(matched.has(i)?'done':opened.includes(i)?'open':'back '+(c.kind==='q'?'question':'answer'));b.textContent=matched.has(i)||opened.includes(i)?c.text:(c.kind==='q'?'❓ PERGUNTA':'💬 RESPOSTA');b.onclick=()=>flip(i);$('board').append(b)})}
function flip(i){if(matched.has(i)||opened.includes(i)||opened.length>=2)return;opened.push(i);tone(550,.08);render();if(opened.length===2)$('bubble').textContent='Confira o par!'}
function check(){if(opened.length!==2){feedback('Abra duas cartas antes de conferir!');return}let[a,b]=opened;if(deck[a].id===deck[b].id&&deck[a].kind!==deck[b].kind){matched.add(a);matched.add(b);opened=[];tone(850,.25);feedback('Acertou! Vamos para a próxima.','win');say('Acertou! Vamos para a próxima.');if(matched.size===20)feedback('🏆 Nível concluído!','win')}else{errors++;tone(190,.32);feedback('Errou. Tente de novo.','fail');say('Errou. Tente de novo.')}render()}
function turnBack(){opened=[];tone(330,.1);render();feedback('Vamos tentar outro par!')}
function choose(n){level=n;build()}
function next(){if(matched.size!==20){feedback('Completem os dez pares antes de avançar!');return}if(level<2){level++;build()}else feedback('🏆 Missão concluída! Vocês venceram!','win')}
function start(){let n=5;feedback('Vamos começar!');$('count').textContent=n;let t=setInterval(()=>{n--;tone(420+n*70,.1);$('count').textContent=n||'JÁ!';if(!n){clearInterval(t);setTimeout(()=>$('count').textContent='',900)}},900)}
document.addEventListener('keydown',e=>{if(e.key==='Enter')check();if(e.code==='Space'){e.preventDefault();turnBack()}});build();
</script></html>
