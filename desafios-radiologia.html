<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desafios de Radiologia • Patrícia Amaral</title><style>body{margin:0;font:16px system-ui;background:#101b39;color:white}main{max-width:850px;margin:auto;padding:24px}h1{color:#ffe16a}.card{background:#1e3157;border:1px solid #6484bd;border-radius:16px;padding:20px;margin:18px 0}button,select{font:inherit;border:0;border-radius:10px;padding:12px;cursor:pointer}button{background:#ffe16a;color:#172448;font-weight:700;margin:5px 0;width:100%;text-align:left}button:disabled{opacity:.7;cursor:default}select{width:100%;margin:12px 0}.muted{color:#c9d5e9}.correct{background:#7ce3aa}.wrong{background:#ffb2ad}#feedback{line-height:1.6}a{color:#ffe16a}</style></head><body><main><p><a href="/">← Patrícia Amaral Criativa</a></p><h1>Desafios de Radiologia</h1><p>Questões técnicas para praticar seus conhecimentos.</p><label for="subject">Escolha a disciplina</label><select id="subject"><option value="mamografia">Mamografia</option><option value="tomografia">Tomografia Computadorizada</option></select><div class="card" id="game" aria-live="polite">Carregando…</div></main><script>
const el=document.getElementById('game'),sel=document.getElementById('subject');let questions=[],index=0,score=0,answered=false;
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){el.textContent='Carregando questões…';try{const r=await fetch('/radioquiz/bancos/'+sel.value+'-radioquiz-30.json',{cache:'no-store'});if(!r.ok)throw Error('Arquivo não encontrado');const data=await r.json();if(!Array.isArray(data.questions)||data.questions.length!==30||data.questions.some(q=>!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.answer_index)||q.answer_index<0||q.answer_index>3))throw Error('Banco inválido');questions=data.questions;index=0;score=0;render()}catch(e){el.textContent='Não foi possível abrir o banco: '+e.message;}}
function render(){answered=false;if(index===questions.length){el.innerHTML='<h2>Rodada concluída!</h2><p>Acertos: '+score+' de '+questions.length+'</p><button id="again">Recomeçar</button>';document.getElementById('again').onclick=load;return;}const q=questions[index];el.innerHTML='<p class="muted">Questão '+(index+1)+' de '+questions.length+' · Acertos: '+score+'</p><h2>'+escapeHtml(q.prompt)+'</h2><div id="options">'+q.options.map((o,i)=>'<button data-answer="'+i+'">'+String.fromCharCode(65+i)+') '+escapeHtml(o)+'</button>').join('')+'</div><p id="feedback"></p><button id="next" hidden>Próxima questão</button>';el.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));document.getElementById('next').onclick=()=>{index++;render()};}
function answer(chosen){if(answered)return;answered=true;const q=questions[index];if(chosen===q.answer_index)score++;el.querySelectorAll('[data-answer]').forEach(b=>{const n=Number(b.dataset.answer);b.disabled=true;if(n===q.answer_index)b.classList.add('correct');else if(n===chosen)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=(chosen===q.answer_index?'<strong>Correto!</strong>':'<strong>Resposta correta: '+String.fromCharCode(65+q.answer_index)+'</strong>')+' '+escapeHtml(q.explanation||'');document.getElementById('next').hidden=false;}
sel.addEventListener('change',load);load();
</script></body></html>
