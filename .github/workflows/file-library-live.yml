name: Biblioteca publicada — verificação real
on:
  push:
    branches: [dev/tomossintese-mamaria-20261113]
    paths: ['_workstation-integration/library-live-target.json']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir bytes publicados e fluxo real da biblioteca
        run: node _workstation-integration/tests/file-library-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-library-live-${{ github.sha }}
          path: artifacts/
          retention-days: 14
