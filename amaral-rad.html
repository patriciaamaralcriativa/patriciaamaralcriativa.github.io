<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src blob: data:; script-src blob: 'unsafe-inline'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'"><title>Workstation Amaral Rad</title><style>
:root{--ar-ink:#eaf8ff;--ar-muted:#a9c8dc;--ar-cyan:#64e8f5;--ar-line:#315c73;--ar-surface:#0d2335;color-scheme:dark}
body{color:var(--ar-ink);background:radial-gradient(ellipse at 78% -25%,#154160 0,transparent 58%),#060f1e}
body>header{background:linear-gradient(115deg,#0b2639,#081426);border-color:#318193}
body>header h1{letter-spacing:.055em;color:#e9fbff}
body>header small{color:var(--ar-muted)}
#mainNav button{border-radius:10px;background:#102a40;border-color:#375e78}
#mainNav button.active{background:#143f5a;border-color:var(--ar-cyan);color:#eaffff;box-shadow:inset 0 -3px #5bd9e9}
main>.panel,main>.t-route,#tab-anatomia,.ar-card{background:linear-gradient(145deg,#122a40,#0b1b2d);border-color:var(--ar-line)}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #98f9ff;outline-offset:3px}
.ar-card{padding:clamp(12px,2vw,22px);border:1px solid var(--ar-line);border-radius:14px;margin-block:14px}
.ar-tag{font-size:.72rem;font-weight:750;letter-spacing:.16em;color:var(--ar-cyan);margin:0 0 8px}
.ar-frame{display:block;width:100%;height:880px;border:1px solid #315f75;border-radius:14px;background:#061622}
.ar-card p{color:var(--ar-muted);line-height:1.55}
.ar-case-actions,.ar-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ar-stage{position:relative;min-width:0;height:clamp(320px,55vh,520px);border:1px solid #376780;border-radius:14px;overflow:hidden;background:#071727}
.ar-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ar-controls{margin:9px 0}
.ar-controls button[aria-pressed=true]{border-color:#91f5ff;background:#145272}
.ar-controls label{color:#d9f5ff}
.ar-key{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem}
.ar-key b{color:#ffe596}
.ar-key span:last-child b{color:#71e9f5}
@media(max-width:720px){.ar-frame{height:72vh;min-height:470px}}
@media(prefers-reduced-motion:reduce){.ar-card *,.ar-stage *{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

#tab-visualizador #tActivityReminder{position:static;z-index:auto}
#prof{z-index:70}

.ar-entry{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-color:#357b91}
.ar-entry h3{margin:0;font-size:clamp(1.15rem,2vw,1.55rem)}
.ar-entry p:last-child{margin:6px 0 0}
#tab-treinos fieldset{border:1px solid #375f76;border-radius:12px;margin:12px 0;padding:14px}
#tab-treinos legend{color:#9bebf3;font-weight:700;padding:0 6px}

#mainNav button,.ar-entry button,.ar-controls button{transition:background-color .16s,border-color .16s,box-shadow .16s}
#mainNav button:hover,.ar-entry button:hover{border-color:#6bdbe8;box-shadow:0 0 12px #44d6eb35}
@media(prefers-reduced-motion:reduce){#mainNav button,.ar-entry button,.ar-controls button{transition:none}}

#tab-didatica [hidden]{display:none!important}
.ard-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ard-head h2,.ard-head p{margin:0}
.ard-layout{display:grid;grid-template-columns:minmax(215px,290px) minmax(0,1fr);gap:14px;align-items:start}
.ard-directory label{margin-bottom:12px}
.ard-directory input,.ard-directory select{width:100%}
#ard-list{display:grid;gap:6px;max-height:min(55vh,520px);overflow:auto;padding:4px}
#ard-list button{text-align:left;min-height:42px}
#ard-list button[aria-pressed=true]{border-color:#86eff8;background:#16435a}
#ard-detail,#ard-staff{min-width:0;overflow-wrap:anywhere}
.ard-fields{display:grid;grid-template-columns:minmax(125px,32%) minmax(0,1fr);gap:0;margin:14px 0}
.ard-fields dt,.ard-fields dd{padding:12px 8px;border-bottom:1px solid #315368;margin:0;line-height:1.5}
.ard-fields dt{font-weight:700;color:#a8f0f7}
.ard-answers{display:grid;gap:8px;margin:12px 0}
.ard-answers button{text-align:left;min-height:44px}
.ard-answers button.ard-correct{border-color:#72d99b;background:#193d35;color:#e2ffed}
.ard-answers button.ard-error{border-color:#e89b92;background:#482b37;color:#fff0eb}
#ard-feedback{border-left:3px solid #75dbeb;padding:9px 12px;background:#133046}
#ard-staff li{margin-bottom:9px}
@media(max-width:720px){.ard-layout{grid-template-columns:minmax(0,1fr)}#ard-list{max-height:225px}}
@media(max-width:450px){.ard-fields{display:block}.ard-fields dt{border:0;padding-bottom:0}.ard-fields dd{padding-top:4px}}

@media(min-width:721px){.ar-frame{height:min(880px,80dvh)}}

#mainNav [data-tab=didatica]{border-color:#63c8df;font-weight:700}
#mainNav button[hidden],#ard-remote[hidden]{display:none!important}
#ard-remote-body details,#ard-remote-body label{margin-block:10px}
#ard-remote-body label:has(input[type=checkbox]){flex-direction:row;align-items:center}
#ard-remote-body summary{cursor:pointer;padding:8px}

#ar-chest-dialog{box-sizing:border-box;width:min(1220px,96vw);max-width:none;height:min(880px,96dvh);max-height:none;border:1px solid #457f99;border-radius:16px;padding:0;background:#081827;color:#eaf8ff;overflow:auto}
#ar-chest-dialog::backdrop{background:#030a13df}
#ar-chest-dialog.ar-chest-expanded{width:100vw;height:100dvh;border-radius:0}
.ar-chest-shell{box-sizing:border-box;min-height:100%;height:100%;display:grid;grid-template-rows:auto minmax(250px,1fr) auto;gap:8px;padding:clamp(8px,2vw,18px)}
.ar-chest-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ar-chest-head h2,.ar-chest-head p,#ar-chest-message{margin:0}
#ar-chest-message{font-size:.85rem;color:#bdd7e5;line-height:1.35}
#ar-chest-screen{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}
#ar-chest-screen .ar-stage{height:auto;min-height:0}
#ar-chest-screen .ar-key{margin:0;color:#bad9e7}
.ar-chest-toolbar{display:flex;align-items:end;gap:7px 16px;flex-wrap:wrap}
.ar-chest-toolbar fieldset{border:0;padding:0;margin:0;min-width:0}
.ar-chest-toolbar legend{font-size:.72rem;color:#a7cbdc;margin-bottom:4px}
.ar-chest-toolbar fieldset>div{display:flex;gap:4px;flex-wrap:wrap}
.ar-chest-toolbar button,.ar-chest-toolbar select,.ar-chest-actions button{font-size:.84rem;min-height:34px;padding:6px 9px}
.ar-chest-toolbar button[aria-pressed=true]{border-color:#91f5ff;background:#145272}
@media(max-width:650px){.ar-chest-actions{margin:0;gap:4px}.ar-chest-toolbar{gap:5px 9px}.ar-chest-shell{grid-template-rows:auto minmax(225px,1fr) auto}.ar-chest-head h2{font-size:1.2rem}}

.ar-home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:0 14px}
.ar-home-grid h3{margin-top:0}
.ard-answer-indicator{font-weight:700}
.ard-quiz-progress{font-size:.85rem;color:#bfe5f0}

.ar-chest-head{padding:0;border:0;background:transparent}

#ard-remote-body textarea{box-sizing:border-box;width:100%;color:#eaf8ff;background:#0a2135;border:1px solid #47748d;border-radius:7px;padding:8px;font:inherit;resize:vertical}
</style>

 else if(type==='t:local-work'&&action==='context')value={scope:'browser'};
 else if(type==='t:local-work'&&action==='list')value=[];
 else if(type==='amaral-learning'&&operation==='load')value={records:{},assignments:[]};
 else if(!['patricia-workstation-control','patricia-workstation-education','t:local-work','amaral-learning'].includes(type))return;
 response(type+'-result',value,value===undefined?'Disponível somente na Sala de Aulas protegida.':undefined);
});
