name: Biblioteca de arquivos — navegador real
on:
  push:
    branches: [dev/tomossintese-mamaria-20261113]
    paths:
      - 'biblioteca-arquivos.html'
      - '_workstation-integration/file-library*'
      - '_workstation-integration/tests/file-library-browser.cjs'
      - '.github/workflows/file-library.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar biblioteca em navegador real
        run: node _workstation-integration/tests/file-library-browser.cjs
      - name: Regressão dos módulos educacionais
        if: always()
        run: node _workstation-integration/tests/dicom-education-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-library-${{ github.sha }}
          path: artifacts/
          retention-days: 14
