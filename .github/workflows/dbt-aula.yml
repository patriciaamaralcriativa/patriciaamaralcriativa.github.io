name: DBT aula — navegador e armazenamento reais
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dbt-aula.yml']
permissions:
  contents: read
jobs:
  dbt-aula:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node _workstation-integration/tests/dbt-lesson-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-aula-results
          path: artifacts/dbt-aula/results.json
          retention-days: 14
