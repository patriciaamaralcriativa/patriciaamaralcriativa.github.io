name: DBT real — amostras científicas restritas
on:
  push:
    branches: [dev/tomossintese-mamaria-20261113]
    paths:
      - '.github/workflows/dbt-real-validation.yml'
      - 'dbt-validacao-real.html'
      - '_workstation-integration/dbt-real-*.js'
      - '_workstation-integration/dbt-validation-allowlist.json'
      - '_workstation-integration/vendor/**'
      - '_workstation-integration/tests/dbt-real-browser.cjs'
      - '_workstation-integration/tests/real-dbt/**'
permissions:
  contents: read
jobs:
  dbt-real:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Obter cópias públicas IDC e conferir hashes dos uploads auditados
        run: python3 _workstation-integration/tests/real-dbt/fetch-fixtures.py "$RUNNER_TEMP/dbt-real"
      - name: Decodificar e renderizar todos os quadros em navegador real
        env:
          DBT_REAL_INPUT_DIR: ${{ runner.temp }}/dbt-real
        run: node _workstation-integration/tests/dbt-real-browser.cjs
      - name: Regressão dos módulos afetados
        if: always()
        run: node _workstation-integration/tests/dicom-education-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-real-${{ github.sha }}
          path: artifacts/
          retention-days: 14
      - name: Remover cópias de trabalho
        if: always()
        run: rm -rf "$RUNNER_TEMP/dbt-real"
